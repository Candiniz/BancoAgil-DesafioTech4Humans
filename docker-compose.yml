version: '3.8'

services:
  app:
    build: .
    container_name: banco_agil_app
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/app/data  # Garante a persistência dos arquivos CSV
    expose:
      - "8501"            # Porta aberta apenas na rede interna do Docker

  nginx:
    image: nginx:alpine
    container_name: banco_agil_nginx
    restart: always
    ports:
      - "80:80"           # Porta pública da minha VPS
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app